[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgen"
version = "1.0.0"
description = "Locally hosted B2B lead generation, cold outreach and lightweight CRM platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "nazeef4" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dotenv>=1.0",
    "dnspython>=2.6",
    "cryptography>=42.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.1"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
leadgen = "leadgen.cli:main"

[tool.setuptools.packages.find]
include = ["leadgen*"]

[tool.setuptools.package-data]
"leadgen" = ["data/*.json", "data/geo/*.json", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Deliberate, reproducible rule set. Ruff's built-in default has changed across
# versions, so the project pins what it wants rather than inheriting it.
select = [
    "E4",   # imports
    "E7",   # statements
    "E9",   # syntax / runtime errors
    "F",    # pyflakes: unused names, undefined names, redefinitions
    "I",    # import sorting
    "UP",   # pyupgrade: modern syntax for the declared target-version
            # (py310, so UP017 will not rewrite timezone.utc to the 3.11-only datetime.UTC)
    "B",    # bugbear: mutable defaults, late bindings, except-pass
    "SIM",  # simplifiable constructs
]
ignore = [
    # FastAPI idiom: Depends()/Query() calls in signature defaults.
    "B008",
    # Long-lived module singletons (get_engine, get_geo_service) are intentional.
    "B019",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
